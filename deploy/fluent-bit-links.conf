# /etc/systemd/system/fluent-bit.service.d/links.conf — runs the package's Fluent Bit with the
# Links config (deploy/fluent-bit.conf), as the unprivileged fluent-bit system user that may only
# read the journal, with its Grafana Cloud settings and token from a root-only file.
[Service]
EnvironmentFile=/etc/fluent-bit/links.env
ExecStart=
ExecStart=/opt/fluent-bit/bin/fluent-bit --quiet -c /etc/fluent-bit/links.conf
# A static user rather than DynamicUser=yes: the system bus drops a dynamic user's connection, and
# the unit metrics come from systemd over D-Bus. The next five lines are what DynamicUser implied.
User=fluent-bit
Group=fluent-bit
SupplementaryGroups=systemd-journal
StateDirectory=fluent-bit
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
RestrictSUIDSGID=yes
RemoveIPC=yes
# It idles under 30 MB; the cap keeps it from ever squeezing the Links server.
MemoryMax=80M
Nice=10
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
CapabilityBoundingSet=
