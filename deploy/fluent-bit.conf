# /etc/fluent-bit/links.conf — ships the Links VPS's logs and basic metrics to Grafana Cloud.
# deploy/monitoring.sh installs it; the ${...} settings come from /etc/fluent-bit/links.env.
# Fluent Bit rather than Grafana Alloy: it idles around 15 MB of RAM, which suits a 512 MB box.

[SERVICE]
    flush        5
    log_level    warn
    # Unsent logs wait out a Grafana Cloud outage on disk (capped per output below).
    storage.path /var/lib/fluent-bit/buffer
    # Loopback only (ufw blocks it anyway): deploy/monitoring.sh reads the push counters here.
    http_server  on
    http_listen  127.0.0.1
    http_port    2020

# The journal of the Links units and Caddy, from where the last run stopped. Not Fluent Bit's own:
# it dumps its state into the journal on every restart, and its errors are mostly about not
# reaching Grafana anyway (see `journalctl -u fluent-bit`).
[INPUT]
    name              systemd
    tag               journal
    systemd_filter    _SYSTEMD_UNIT=links.service
    systemd_filter    _SYSTEMD_UNIT=links-backup.service
    systemd_filter    _SYSTEMD_UNIT=caddy.service
    read_from_tail    on
    strip_underscores on
    lowercase         on
    db                /var/lib/fluent-bit/journal.db
    storage.type      filesystem

# Just the message and the unit, which becomes a label.
[FILTER]
    name   record_modifier
    match  journal
    allowlist_key message
    allowlist_key systemd_unit

# Host metrics once a minute, a few hundred series: well inside the free tier's 10k. The systemd
# collector reports only the Links units, Caddy and Fluent Bit.
[INPUT]
    name            node_exporter_metrics
    tag             node
    scrape_interval 60
    scrape_on_start on
    metrics         cpu,meminfo,diskstats,filesystem,uname,stat,time,loadavg,vmstat,netdev,filefd,systemd
    systemd_include_pattern ^(links|links-backup|caddy|fluent-bit)\.(service|timer)$
    systemd_service_restart_metrics on
    filesystem.ignore_mount_point_regex ^/(dev|proc|run|sys|snap|var/lib/docker)($|/)
    diskstats.ignore_device_regex ^(ram|loop|fd|dm-|sr)\d*$

[OUTPUT]
    name           loki
    match          journal
    host           ${LOKI_HOST}
    port           ${LOKI_PORT}
    tls            ${LOKI_TLS}
    uri            ${LOKI_URI}
    http_user      ${LOKI_USER}
    http_passwd    ${GRAFANA_CLOUD_TOKEN}
    labels         job=links, host=${LINKS_HOST}
    label_keys     $systemd_unit
    remove_keys    systemd_unit
    drop_single_key raw
    retry_limit    no_limits
    storage.total_limit_size 100M

[OUTPUT]
    name        prometheus_remote_write
    match       node
    host        ${PROM_HOST}
    port        ${PROM_PORT}
    tls         ${PROM_TLS}
    uri         ${PROM_URI}
    http_user   ${PROM_USER}
    http_passwd ${GRAFANA_CLOUD_TOKEN}
    add_label   job links
    add_label   instance ${LINKS_HOST}
    retry_limit 5
