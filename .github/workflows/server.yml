name: Server

on:
  # Every PR, not just server/ ones: main requires this workflow's check, and a check that never
  # reports blocks the merge. The changes job below decides whether it runs or reports "skipped",
  # which counts as passing.
  pull_request:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede older runs of a PR; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      # --no-renames lists both sides of a move, so moving a file out of the area counts too.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(server/|\.github/workflows/server\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  check:
    name: Typecheck, test and build
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as local development and the deployed binary (see package.json's @types/bun).
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Offline: WorkOS and preview pages are local stubs inside the tests.
      - run: bun test
      # The x64 and arm64 binaries deploy/deploy.sh ships to the VPS.
      - run: bun run build
      # The shipped x64 (baseline) binary as a real process: sign-in, the API, its CLI, migrations
      # and shutdown, over HTTP. Offline too.
      - run: bun run test:e2e
        env:
          LINKS_BINARY: dist/links-server-linux-x64
