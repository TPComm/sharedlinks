name: Server

on:
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede older runs of a PR; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as local development and the deployed binary (see package.json's @types/bun).
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Offline: WorkOS and preview pages are local stubs inside the tests.
      - run: bun test
      # The x64 and arm64 binaries deploy/deploy.sh ships to the VPS.
      - run: bun run build
