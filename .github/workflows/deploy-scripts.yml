name: Deploy scripts

on:
  # Every PR, not just deploy/ ones: main requires this workflow's check, and a check that never
  # reports blocks the merge. The changes job below decides whether it runs or reports "skipped",
  # which counts as passing.
  pull_request:
  push:
    branches: [main]
    paths: ["deploy/**", ".github/workflows/deploy-scripts.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede older runs of a PR; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      - id: diff
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(deploy/|\.github/workflows/deploy-scripts\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  shellcheck:
    name: ShellCheck
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled (0.9.0 on Ubuntu 24.04, pinned so findings stay stable). Warnings
      # and errors fail the job; style notes (e.g. "expands on the client side", intended in setup.sh) don't.
      - run: shellcheck --severity=warning deploy/*.sh
