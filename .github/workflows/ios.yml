name: iOS

on:
  # Every PR, not just iOS ones: main requires this workflow's check, and a check that never
  # reports blocks the merge. The changes job below decides whether it runs or reports "skipped",
  # which counts as passing.
  pull_request:
  push:
    branches: [main]
    # Keep this in sync with the PR changes filter: UI tests run against server/ too.
    paths: ["ios/**", "assets/icon/**", "server/**", ".github/workflows/ios.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older run, on main too: the newest commit includes the older ones,
  # and it frees the macOS runners for the next run. (The Linux workflows let runs on main finish.)
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      # --no-renames lists both sides of a move, so moving a file out of the area counts too.
      # The app icon lives outside ios/ (assets/icon/SharedLinks.icon), so changes there count too.
      # UI tests start server/, so server changes must exercise the app/server contract before merge.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(ios/|assets/icon/|server/|\.github/workflows/ios\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  # Three independent macOS jobs leave two slots under the org cap of five for another run.
  # Each slice builds before booting to avoid resource contention on the runner.
  ui-tests:
    name: UI tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # The only hosted image with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The image defaults to Xcode 27.1; use 27.2, the same build as local development.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # Slice 1 also runs LinksKit and the UI test script checks (~80–100s on recent main runs).
      LINKS_UI_TEST_FIRST_SHARD_OVERHEAD: 100
    steps:
      - uses: actions/checkout@v7

      - name: UI test recovery classifier tests
        if: matrix.shard == 1
        run: |
          python3 ios/scripts/test-ui-test-recovery.py
          python3 ios/scripts/test-ui-test-planning.py

      - name: Xcode version and Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: LinksKit tests
        if: matrix.shard == 1
        working-directory: ios/LinksKit
        run: swift test

      # Compile the app, its extensions and UI tests for the Simulator on each runner. Signed ad
      # hoc (the Simulator default), since the app needs its App Group entitlement for the keychain.
      # arm64 only, which halves the work.
      - name: Build Links and its UI tests
        working-directory: ios
        run: >-
          xcodebuild build-for-testing
          -project Links.xcodeproj
          -scheme Links
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          ARCHS=arm64

      # App Store Connect rejects a bundle that uses a required-reason API (UserDefaults, via
      # LinksKit) without declaring it, so every shipped bundle must carry a valid manifest.
      - name: Privacy manifest in every bundle
        if: matrix.shard == 1
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        run: |
          for bundle in Links.app Links.app/PlugIns/LinksShare.appex Links.app/PlugIns/LinksWidgets.appex Links.app/PlugIns/LinksMessages.appex Links.app/PlugIns/LinksNotifications.appex; do
            plutil -lint "$bundle/PrivacyInfo.xcprivacy"
          done

      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as server.yml and local development.
          bun-version: 1.4.4

      - name: Boot and check UI test Simulator
        shell: bash
        timeout-minutes: 20
        env:
          PRIMARY_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-2
          FALLBACK_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
        run: |
          mkdir -p ios/diagnostics/simulator
          touch "$RUNNER_TEMP/links-ui-simulator-start"

          run_bounded() {
            local limit=$1 remaining
            shift
            if [[ -n ${preflight_deadline:-} ]]; then
              remaining=$((preflight_deadline - SECONDS))
              if (( remaining <= 0 )); then
                echo "Simulator preflight budget exhausted before $*" >&2
                return 124
              fi
              if (( remaining < limit )); then limit=$remaining; fi
            fi
            python3 -c '
          import os, signal, subprocess, sys

          limit, *command = sys.argv[1:]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              sys.exit(process.wait(timeout=int(limit)))
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              process.wait()
              print(f"Timed out after {limit}s:", " ".join(command), file=sys.stderr)
              sys.exit(124)' "$limit" "$@"
          }

          simctl() {
            local limit=$1
            shift
            run_bounded "$limit" xcrun simctl "$@"
          }

          check_cache() {
            local limit=$1
            shift
            run_bounded "$limit" python3 -u - "$@" <<'PY'
          import json
          import os
          import re
          import struct
          import subprocess
          import sys
          from pathlib import Path
          from time import monotonic, sleep

          mode, target, receipt_path = sys.argv[1:]
          receipt = Path(receipt_path)

          def runtime_mount(target, booted):
              command = ["xcrun", "simctl", "list", "-j"]
              if not booted:
                  command.append("runtimes")
              simulators = json.loads(subprocess.check_output(command))
              runtime_id = target
              if booted:
                  runtime_id = next((identifier for identifier, devices in simulators["devices"].items()
                                     if any(d["udid"] == target and d["state"] == "Booted"
                                            for d in devices)), None)
              for runtime in simulators["runtimes"]:
                  if runtime["identifier"] == runtime_id and runtime["isAvailable"]:
                      root = Path(runtime["runtimeRoot"]).resolve(strict=True)
                      stat = root.stat()
                      return [runtime_id, runtime["buildversion"], str(root), stat.st_dev, stat.st_ino]
              raise FileNotFoundError(f"No available runtime for {target}")

          if mode == "verify":
              actual = runtime_mount(target, booted=True)
              expected = json.loads(receipt.read_text())
              if actual != expected:
                  raise SystemExit(f"Runtime build or mount changed after cache read: {expected} -> {actual}")
              runtime_id, build, root, _, _ = actual
              print(f"Simulator {target}: verified {runtime_id} ({build}) at {root}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  print(f"LINKS_UI_TEST_RUNTIME_ROOT={root}", file=env)
              subprocess.run(["df", "-P", root], check=True)
              sys.exit(0)

          started = monotonic()
          while True:
              try:
                  mount = runtime_mount(target, booted=False)
                  break
              except FileNotFoundError:
                  if monotonic() - started >= 30:
                      raise
                  sleep(1)
          runtime_id, build, root, _, _ = mount
          print(f"Simulator cache mount ready in {monotonic() - started:.1f}s: {runtime_id} ({build}) at {root}")
          root = Path(root)
          cache = root / "System/Library/Caches/com.apple.dyld/dyld_sim_shared_cache_arm64"
          started = monotonic()
          # dyld_cache_format.h: subCacheArrayOffset/Count at 0x188, with 56-byte entries
          # (UUID, VM offset, file suffix) in the iOS 27 cache format.
          entry = struct.Struct("<16sQ32s")
          with cache.open("rb") as file:
              header = file.read(0x190)
              if not header.startswith(b"dyld_v1") or len(header) != 0x190:
                  raise SystemExit(f"Invalid dyld cache header: {cache}")
              mapping_offset, = struct.unpack_from("<I", header, 0x10)
              offset, count = struct.unpack_from("<II", header, 0x188)
              if mapping_offset <= 0x1c8 or (count and offset < mapping_offset):
                  raise SystemExit(f"Invalid dyld cache subcache metadata: {cache}")
              if count and offset + count * entry.size > os.fstat(file.fileno()).st_size:
                  raise SystemExit(f"Incomplete dyld cache subcache table: {cache}")
              file.seek(offset)
              table = file.read(count * entry.size)
              if len(table) != count * entry.size:
                  raise SystemExit(f"Unreadable dyld cache subcache table: {cache}")
          files = [(cache, None)]
          for uuid, _, raw_suffix in entry.iter_unpack(table):
              suffix = raw_suffix.split(b"\0", 1)[0].decode("ascii")
              if not re.fullmatch(r"\.[a-zA-Z0-9._-]+", suffix):
                  raise SystemExit(f"Invalid dyld subcache suffix: {suffix!r}")
              files.append((cache.with_name(cache.name + suffix), uuid))
          for path, _ in files:
              if not path.is_file():
                  raise SystemExit(f"Missing required dyld cache file: {path}")
          buffer = bytearray(8 * 1024 * 1024)
          for path, uuid in files:
              with path.open("rb") as file:
                  header = file.read(0x68)
                  size = os.fstat(file.fileno()).st_size
                  if not header.startswith(b"dyld_v1") or len(header) != 0x68:
                      raise SystemExit(f"Invalid dyld cache header: {path}")
                  if uuid is not None and header[0x58:0x68] != uuid:
                      raise SystemExit(f"Wrong dyld subcache UUID: {path}")
                  read = len(header)
                  while chunk := file.readinto(buffer):
                      read += chunk
                  if read != size:
                      raise SystemExit(f"Incomplete dyld cache read: {path}")
              print(f"Readable dyld cache: {path.name} ({size} bytes)")
          print(f"Read {len(files)} dyld cache files in {monotonic() - started:.1f}s")
          receipt.write_text(json.dumps(mount))
          PY
          }

          boot_and_check() {
            local runtime=$1 budget=$2 started=$SECONDS phase probe_deadline pid previous_pid=""
            local cache_pid receipt boot_ok=0
            local preflight_deadline=$((started + budget))
            udid=""
            echo "Simulator preflight: $runtime"
            udid=$(simctl 30 create 'Links UI Tests (preflight)' 'iPhone 17' "$runtime") || return 1
            echo "LINKS_UI_TEST_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
            receipt="$RUNNER_TEMP/links-ui-cache-$udid.json"
            check_cache 120 read "$runtime" "$receipt" &
            cache_pid=$!
            if simctl 30 boot "$udid" && simctl 325 bootstatus "$udid" -b; then
              boot_ok=1
            fi
            echo "Simulator create and boot phase: $((SECONDS - started))s (success=$boot_ok)"
            phase=$SECONDS
            wait "$cache_pid" || return 1
            echo "Simulator cache read wait after boot: $((SECONDS - phase))s"
            (( boot_ok )) || return 1
            phase=$SECONDS
            check_cache 30 verify "$udid" "$receipt" || return 1
            echo "Simulator booted runtime verification: $((SECONDS - phase))s"
            phase=$SECONDS
            simctl 15 spawn "$udid" launchctl kickstart user/foreground/com.apple.InputUI || return 1
            probe_deadline=$((SECONDS + 30))
            if (( preflight_deadline < probe_deadline )); then probe_deadline=$preflight_deadline; fi
            while (( SECONDS < probe_deadline )); do
              sleep 1
              if ! pid=$(preflight_deadline=$probe_deadline simctl 10 spawn "$udid" launchctl print user/foreground/com.apple.InputUI |
                awk '$1=="state" && $2=="=" { state=$3 } $1=="pid" && $2=="=" { pid=$3 }
                     END { if (state=="running" && pid>0) print pid }'); then
                previous_pid=""
                continue
              fi
              if [[ -n "$pid" && "$pid" == "$previous_pid" ]]; then
                simctl 15 rename "$udid" 'Links UI Tests' || return 1
                echo "Simulator InputUI readiness phase: $((SECONDS - phase))s"
                echo "Simulator preflight passed: $runtime, InputUI PID $pid, $((SECONDS - started))s"
                return 0
              fi
              previous_pid=$pid
            done
            echo "InputUI did not stay running on $udid" >&2
            return 1
          }

          discard_device() {
            if [[ -n "$udid" ]]; then
              echo "Discarding Simulator $udid after failed preflight"
              simctl 8 shutdown "$udid" || true
              simctl 8 delete "$udid" || true
            fi
          }

          remount_runtime() {
            local runtime=$1 runtimes preflight_deadline=$((SECONDS + 45))
            # These services are dedicated to this hosted runner. Relaunch them before rescanning.
            run_bounded 5 pkill -u "$(id -u)" -x com.apple.CoreSimulator.CoreSimulatorService || true
            run_bounded 5 sudo -n pkill -x simdiskimaged || true
            simctl 25 runtime scan-and-mount || return 1
            while (( SECONDS < preflight_deadline )); do
              if runtimes=$(simctl 10 runtime list -j) && python3 -c '
          import json, sys
          sys.exit(not any(r.get("runtimeIdentifier") == sys.argv[1] and r.get("state") == "Ready"
                           for r in json.load(sys.stdin).values()))' "$runtime" <<< "$runtimes"; then
                echo "Runtime is Ready after rescan: $runtime"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          log_runtime_inventory() {
            local started=$SECONDS
            simctl 150 runtime list -v || true
            run_bounded 10 mount | grep -Ei 'coresimulator|cryptex|simruntime' || true
            run_bounded 10 df -h / || true
            echo "Simulator pre-test runtime inventory: $((SECONDS - started))s"
          }

          {
            log_runtime_inventory > ios/diagnostics/simulator/runtime-inventory-before.log 2>&1 &
            inventory_pid=$!
            # Three attempt budgets + 45s rescan + two 16s cleanups fit inside 20 minutes.
            preflight_status=0
            if ! boot_and_check "$PRIMARY_SIMULATOR_RUNTIME" 420; then
              discard_device
              echo "Simulator preflight failed; restarting CoreSimulator and rescanning $PRIMARY_SIMULATOR_RUNTIME"
              if ! { remount_runtime "$PRIMARY_SIMULATOR_RUNTIME" && boot_and_check "$PRIMARY_SIMULATOR_RUNTIME" 320; }; then
                discard_device
                echo "Simulator preflight recovery failed; falling back to $FALLBACK_SIMULATOR_RUNTIME"
                boot_and_check "$FALLBACK_SIMULATOR_RUNTIME" 320 || preflight_status=$?
              fi
            fi
            phase=$SECONDS
            wait "$inventory_pid" || true
            echo "Simulator runtime inventory wait after preflight: $((SECONDS - phase))s"
            tail -n 1 ios/diagnostics/simulator/runtime-inventory-before.log
            exit "$preflight_status"
          } 2>&1 | tee ios/diagnostics/simulator/runtime-before.log

      # Starts the server from source with an empty database and drives the app in the "Links UI
      # Tests" Simulator through this slice of the tests. A runner crash can mean another boot,
      # so leave room for recovery rather than kill a passing run.
      - name: UI tests
        timeout-minutes: 40
        env:
          LINKS_UI_TEST_ACTION: test-without-building
          LINKS_UI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          LINKS_UI_TEST_LOGS: ${{ github.workspace }}/ios/diagnostics/ui-test-logs
        run: ios/scripts/ui-tests.sh

      - name: Check Simulator system crash reports
        if: ${{ !cancelled() && env.LINKS_UI_TEST_SIMULATOR_UDID != '' }}
        shell: bash
        run: |
          diagnostics=ios/diagnostics/simulator
          mkdir -p "$diagnostics"
          phase=$SECONDS
          {
            xcrun simctl runtime list -v || true
            mount | grep -Ei 'coresimulator|cryptex|simruntime' || true
            df -h / "${LINKS_UI_TEST_RUNTIME_ROOT:-/}" || true
          } 2>&1 | tee "$diagnostics/runtime-after.log"
          echo "Simulator post-test runtime inventory: $((SECONDS - phase))s"

          phase=$SECONDS
          audit_status=0
          python3 - "$diagnostics" <<'PY' | tee "$diagnostics/system-crashes.log" || audit_status=$?
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          udid = os.environ["LINKS_UI_TEST_SIMULATOR_UDID"]
          coalition = f"com.apple.CoreSimulator.SimDevice.{udid}"
          start = (Path(os.environ["RUNNER_TEMP"]) / "links-ui-simulator-start").stat().st_mtime_ns
          output = Path(sys.argv[1]) / "system-crashes"
          root = os.environ.get("LINKS_UI_TEST_RUNTIME_ROOT")
          system_paths = ("/Volumes/", "/Library/Developer/", "/System/", "/usr/",
                          "/private/var/run/com.apple.security.cryptexd/")
          if root:
              system_paths += (f"{root}/",)
          keyboard = other = 0
          for report in sorted((Path.home() / "Library/Logs/DiagnosticReports").glob("*.ips")):
              if report.stat().st_mtime_ns <= start:
                  continue
              try:
                  with report.open() as file:
                      header = json.loads(file.readline())
                      crash = json.load(file)
              except (OSError, ValueError) as error:
                  print(f"Could not read {report.name}: {error}")
                  continue
              if crash.get("coalitionName") != coalition:
                  continue
              input_ui = (crash.get("procName") == "InputUI"
                          or header.get("bundleID") == "com.apple.InputUI")
              if not input_ui and not crash.get("procPath", "").startswith(system_paths):
                  continue
              output.mkdir(exist_ok=True)
              shutil.copy2(report, output / report.name)
              reason = crash.get("termination", {})
              print(f"{report.name}: {reason.get('namespace', '')} {reason.get('indicator', '')}".rstrip())
              keyboard += input_ui
              other += not input_ui
          print(f"Simulator {udid}: {keyboard} InputUI and {other} other system-process crash reports")
          sys.exit(1 if keyboard else 0)
          PY
          echo "Simulator crash audit phase: $((SECONDS - phase))s"
          exit "$audit_status"

      - name: Collect UI test diagnostics
        if: failure()
        run: |
          mkdir -p ios/diagnostics
          cp -R ~/Library/Logs/DiagnosticReports ios/diagnostics/host-crashes || true
          find ~/Library/Developer/CoreSimulator/Devices -type d -name CrashReporter -exec cp -R {} ios/diagnostics/ \; || true
          xcrun simctl diagnose -b --output=ios/diagnostics || true

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-diagnostics-${{ matrix.shard }}
          retention-days: 5
          path: |
            ios/build/Logs/Test/*.xcresult
            ios/diagnostics/

      - name: Upload Simulator diagnostics on success
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-diagnostics-${{ matrix.shard }}
          retention-days: 5
          path: ios/diagnostics/simulator/

  check:
    # The name main's ruleset requires: rename it there too if it changes.
    name: LinksKit tests, app build and UI tests
    needs: [changes, ui-tests]
    # Skipped (which counts as passing) exactly when the jobs above are; otherwise it runs even
    # when one of them failed, so it can fail too.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: |
          echo "LinksKit tests, app build and UI tests: $UI_RESULT"
          [[ $UI_RESULT == success ]]
