name: iOS

on:
  # Every PR, not just iOS ones: main requires this workflow's check, and a check that never
  # reports blocks the merge. The changes job below decides whether it runs or reports "skipped",
  # which counts as passing.
  pull_request:
  push:
    branches: [main]
    # The UI tests run the app against server/, so on main server changes count as well.
    paths: ["ios/**", "assets/icon/**", "server/**", ".github/workflows/ios.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older run, on main too: the newest commit includes the older ones,
  # and a macOS run costs ~10x Linux. (The Linux workflows still let runs on main finish.)
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      # --no-renames lists both sides of a move, so moving a file out of the area counts too.
      # The app icon lives outside ios/ (assets/icon/SharedLinks.icon), so changes there count too.
      # A PR that only touches server/ skips the macOS job (~10x Linux minutes): server.yml and
      # deploy-e2e.yml check it on Linux, and the push to main still runs the UI tests on it.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(ios/|assets/icon/|\.github/workflows/ios\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  build:
    name: LinksKit tests, app build and UI tests
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # The only hosted image with Xcode 27. One job for everything: macOS minutes cost ~10x Linux
    # and each job pays its own start-up and rounding.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      # The image defaults to Xcode 27.1; use 27.2, the same build as local development.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Xcode version and Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: LinksKit tests
        working-directory: ios/LinksKit
        run: swift test

      # Compile the app, Share Extension, widgets and UI tests for the Simulator, once: the UI
      # test step runs these products. Signed ad hoc (the Simulator default), since the app needs
      # its App Group entitlement for the keychain. arm64 only, which halves the work.
      - name: Build Links and its UI tests
        working-directory: ios
        run: >-
          xcodebuild build-for-testing
          -project Links.xcodeproj
          -scheme Links
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          ARCHS=arm64

      # App Store Connect rejects a bundle that uses a required-reason API (UserDefaults, via
      # LinksKit) without declaring it, so every shipped bundle must carry a valid manifest.
      - name: Privacy manifest in every bundle
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        run: |
          for bundle in Links.app Links.app/PlugIns/LinksShare.appex Links.app/PlugIns/LinksWidgets.appex; do
            plutil -lint "$bundle/PrivacyInfo.xcprivacy"
          done

      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as server.yml and local development.
          bun-version: 1.4.4

      # Starts the server from source with an empty database, creates a "Links UI Tests"
      # Simulator, and drives the app in it.
      # 22 tests take ~12 minutes on the hosted runner, after up to ~8 minutes creating and booting
      # the Simulator, so 20 minutes cut off runs that were passing.
      - name: UI tests
        timeout-minutes: 30
        env:
          LINKS_UI_TEST_ACTION: test-without-building
        run: ios/scripts/ui-tests.sh
