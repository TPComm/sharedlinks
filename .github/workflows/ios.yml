name: iOS

on:
  # Every PR, not just iOS ones: main requires this workflow's check, and a check that never
  # reports blocks the merge. The changes job below decides whether it runs or reports "skipped",
  # which counts as passing.
  pull_request:
  push:
    branches: [main]
    # Keep this in sync with the PR changes filter: UI tests run against server/ too.
    paths: ["ios/**", "assets/icon/**", "server/**", ".github/workflows/ios.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes an older run, on main too: the newest commit includes the older ones,
  # and it frees the macOS runners for the next run. (The Linux workflows let runs on main finish.)
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      # --no-renames lists both sides of a move, so moving a file out of the area counts too.
      # The app icon lives outside ios/ (assets/icon/SharedLinks.icon), so changes there count too.
      # UI tests start server/, so server changes must exercise the app/server contract before merge.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(ios/|assets/icon/|server/|\.github/workflows/ios\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  # Three independent macOS jobs leave two slots under the org cap of five for another run.
  # Each slice builds before booting to avoid resource contention on the runner.
  ui-tests:
    name: UI tests (${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # The only hosted image with Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # The image defaults to Xcode 27.1; use 27.2, the same build as local development.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # Slice 1 also runs LinksKit and the UI test script checks (~80–100s on recent main runs).
      LINKS_UI_TEST_FIRST_SHARD_OVERHEAD: 100
    steps:
      - uses: actions/checkout@v7

      - name: UI test recovery classifier tests
        if: matrix.shard == 1
        run: |
          python3 ios/scripts/test-ui-test-recovery.py
          python3 ios/scripts/test-ui-test-planning.py

      - name: Xcode version and Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: LinksKit tests
        if: matrix.shard == 1
        working-directory: ios/LinksKit
        run: swift test

      # Compile the app, its extensions and UI tests for the Simulator on each runner. Signed ad
      # hoc (the Simulator default), since the app needs its App Group entitlement for the keychain.
      # arm64 only, which halves the work.
      - name: Build Links and its UI tests
        working-directory: ios
        run: >-
          xcodebuild build-for-testing
          -project Links.xcodeproj
          -scheme Links
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          ARCHS=arm64

      # App Store Connect rejects a bundle that uses a required-reason API (UserDefaults, via
      # LinksKit) without declaring it, so every shipped bundle must carry a valid manifest.
      - name: Privacy manifest in every bundle
        if: matrix.shard == 1
        working-directory: ios/build/Build/Products/Debug-iphonesimulator
        run: |
          for bundle in Links.app Links.app/PlugIns/LinksShare.appex Links.app/PlugIns/LinksWidgets.appex Links.app/PlugIns/LinksMessages.appex Links.app/PlugIns/LinksNotifications.appex; do
            plutil -lint "$bundle/PrivacyInfo.xcprivacy"
          done

      - uses: oven-sh/setup-bun@v2
        with:
          # Same Bun as server.yml and local development.
          bun-version: 1.4.4

      - name: Boot UI test Simulator
        run: |
          started=$SECONDS
          touch "$RUNNER_TEMP/links-ui-simulator-start"
          udid=$(xcrun simctl create "Links UI Tests" 'iPhone 17')
          echo "Created Simulator Links UI Tests ($udid)"
          echo "LINKS_UI_TEST_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "Simulator boot and bootstatus completed in $((SECONDS - started))s"

      # Starts the server from source with an empty database and drives the app in the "Links UI
      # Tests" Simulator through this slice of the tests. A runner crash can mean another boot,
      # so leave room for recovery rather than kill a passing run.
      - name: UI tests
        timeout-minutes: 40
        env:
          LINKS_UI_TEST_ACTION: test-without-building
          LINKS_UI_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          LINKS_UI_TEST_LOGS: ${{ github.workspace }}/ios/diagnostics/ui-test-logs
        run: |
          # Keep the test tree in its own process group so a crash can stop the whole slice.
          set -m
          ios/scripts/ui-tests.sh &
          test_pid=$!
          python3 - "$test_pid" <<'PY' &
          import json
          import os
          import signal
          import sys
          from pathlib import Path
          from time import sleep

          udid = os.environ["LINKS_UI_TEST_SIMULATOR_UDID"]
          coalition = f"com.apple.CoreSimulator.SimDevice.{udid}"
          start = (Path(os.environ["RUNNER_TEMP"]) / "links-ui-simulator-start").stat().st_mtime_ns
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          seen = set()
          while True:
              excerpt = None
              for report in reports.glob("InputUI-*.ips"):
                  if report in seen:
                      continue
                  try:
                      if report.stat().st_mtime_ns <= start:
                          seen.add(report)
                          continue
                      with report.open() as file:
                          file.readline()
                          crash = json.load(file)
                  except (OSError, ValueError):
                      continue
                  seen.add(report)
                  if crash.get("coalitionName") != coalition:
                      continue
                  reason = crash.get("termination", {})
                  if excerpt is None or reason.get("namespace") == "DYLD":
                      excerpt = (report.name, reason)
                  if reason.get("namespace") == "DYLD":
                      break
              if excerpt is not None:
                  name, reason = excerpt
                  print(f"InputUI crashed on Simulator {udid}; stopping UI tests: {name}", file=sys.stderr)
                  print(f"{reason.get('namespace', '')}: {reason.get('indicator', '')}", file=sys.stderr)
                  for line in reason.get("reasons", [])[:1]:
                      print(line, file=sys.stderr)
                  try:
                      os.killpg(int(sys.argv[1]), signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  break
              sleep(2)
          PY
          watcher_pid=$!
          trap 'kill "$watcher_pid" 2>/dev/null || true' EXIT
          trap 'kill -TERM -- "-$test_pid" 2>/dev/null || true; exit 130' INT TERM
          wait "$test_pid"

      - name: Check Simulator system crash reports
        if: ${{ !cancelled() && env.LINKS_UI_TEST_SIMULATOR_UDID != '' }}
        shell: bash
        run: |
          diagnostics=ios/diagnostics/simulator
          mkdir -p "$diagnostics"
          phase=$SECONDS
          {
            xcrun simctl runtime list -v || true
            mount | grep -Ei 'coresimulator|cryptex|simruntime' || true
            df -h / || true
          } 2>&1 | tee "$diagnostics/runtime-after.log"
          echo "Simulator post-test runtime inventory: $((SECONDS - phase))s"

          phase=$SECONDS
          audit_status=0
          python3 - "$diagnostics" <<'PY' | tee "$diagnostics/system-crashes.log" || audit_status=$?
          import json
          import os
          import shutil
          import sys
          from pathlib import Path
          from time import monotonic, sleep

          udid = os.environ["LINKS_UI_TEST_SIMULATOR_UDID"]
          coalition = f"com.apple.CoreSimulator.SimDevice.{udid}"
          start = (Path(os.environ["RUNNER_TEMP"]) / "links-ui-simulator-start").stat().st_mtime_ns
          output = Path(sys.argv[1]) / "system-crashes"
          system_paths = ("/Volumes/", "/Library/Developer/", "/System/", "/usr/",
                          "/private/var/run/com.apple.security.cryptexd/")
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          deadline = monotonic() + 36
          seen = set()
          unreadable = {}
          keyboard = other = 0
          while True:
              for report in sorted(reports.glob("*.ips")):
                  if report in seen:
                      continue
                  try:
                      if report.stat().st_mtime_ns <= start:
                          seen.add(report)
                          continue
                      with report.open() as file:
                          header = json.loads(file.readline())
                          crash = json.load(file)
                  except (OSError, ValueError) as error:
                      unreadable[report] = str(error)
                      continue
                  seen.add(report)
                  unreadable.pop(report, None)
                  if crash.get("coalitionName") != coalition:
                      continue
                  input_ui = (crash.get("procName") == "InputUI"
                              or header.get("bundleID") == "com.apple.InputUI")
                  if not input_ui and not crash.get("procPath", "").startswith(system_paths):
                      continue
                  output.mkdir(exist_ok=True)
                  shutil.copy2(report, output / report.name)
                  reason = crash.get("termination", {})
                  print(f"{report.name}: {reason.get('namespace', '')} {reason.get('indicator', '')}".rstrip())
                  keyboard += input_ui
                  other += not input_ui
              remaining = deadline - monotonic()
              if keyboard or remaining <= 0:
                  break
              sleep(min(2, remaining))
          for report, error in unreadable.items():
              print(f"Could not read {report.name}: {error}")
          print(f"Simulator {udid}: {keyboard} InputUI and {other} other system-process crash reports")
          sys.exit(1 if keyboard else 0)
          PY
          echo "Simulator crash audit phase: $((SECONDS - phase))s"
          exit "$audit_status"

      - name: Collect UI test diagnostics
        if: failure()
        run: |
          mkdir -p ios/diagnostics
          cp -R ~/Library/Logs/DiagnosticReports ios/diagnostics/host-crashes || true
          find ~/Library/Developer/CoreSimulator/Devices -type d -name CrashReporter -exec cp -R {} ios/diagnostics/ \; || true
          xcrun simctl diagnose -b --output=ios/diagnostics || true

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-diagnostics-${{ matrix.shard }}
          retention-days: 5
          path: |
            ios/build/Logs/Test/*.xcresult
            ios/diagnostics/

      - name: Upload Simulator diagnostics on success
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-diagnostics-${{ matrix.shard }}
          retention-days: 5
          path: ios/diagnostics/simulator/

  check:
    # The name main's ruleset requires: rename it there too if it changes.
    name: LinksKit tests, app build and UI tests
    needs: [changes, ui-tests]
    # Skipped (which counts as passing) exactly when the jobs above are; otherwise it runs even
    # when one of them failed, so it can fail too.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          UI_RESULT: ${{ needs.ui-tests.result }}
        run: |
          echo "LinksKit tests, app build and UI tests: $UI_RESULT"
          [[ $UI_RESULT == success ]]
