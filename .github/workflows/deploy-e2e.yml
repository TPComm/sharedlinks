name: Deploy end-to-end

# Runs deploy/setup.sh and deploy/deploy.sh for real against the runner itself, logged in as root
# over SSH like on a fresh VPS: provisioning, merging settings on a re-run, a redeploy, and the
# automatic rollback of a build that can't start. The checks are in deploy/test/e2e.sh.

on:
  # Every PR, not just deploy/ and server/ ones: main requires this workflow's check, and a check
  # that never reports blocks the merge. The changes job below decides whether it runs or reports
  # "skipped", which counts as passing.
  pull_request:
  push:
    branches: [main]
    paths: ["deploy/**", "server/**", ".github/workflows/deploy-e2e.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede older runs of a PR; let runs on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A PR checks out GitHub's test merge, whose first parent is main: the diff is what merging
      # changes. (The list is saved first because grep -q in a pipe would cut git off and fail it.)
      # --no-renames lists both sides of a move, so moving a file out of the area counts too.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qE '^(deploy/|server/|\.github/workflows/deploy-e2e\.yml$)' <<<"$files"; then
            echo relevant=true >>"$GITHUB_OUTPUT"
          else
            echo relevant=false >>"$GITHUB_OUTPUT"
          fi

  e2e:
    name: setup.sh and deploy.sh as root on Ubuntu 24.04
    needs: changes
    # Pushes to main skip `changes`; if it failed, run rather than let a skipped check pass.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # A throwaway VM with systemd and passwordless sudo, which setup.sh needs (containers lack systemd).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A PR's checkout is a detached merge commit, so skip deploy.sh's clean-main check.
      DEPLOY_ANY_CHECKOUT: "1"
    defaults:
      run:
        # An explicit shell: bash adds -o pipefail, so `script | tee log` fails when the script does.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # deploy.sh tests and compiles with the bun on PATH: the same Bun as server.yml.
          bun-version: 1.4.4
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Let root log in over SSH to localhost
        timeout-minutes: 3
        run: deploy/test/e2e.sh ssh-root

      - name: Wait for cloud-init
        timeout-minutes: 4
        run: deploy/test/e2e.sh cloud-init

      # "localhost" gets its certificate from Caddy's own CA: no ACME, no DNS. The runner doesn't
      # trust that CA yet, so this first run's deploy.sh prints its "Couldn't reach" note; the check
      # step then trusts it, and every later deploy.sh must reach https://localhost itself.
      - name: setup.sh, first run
        timeout-minutes: 12
        run: |
          WORKOS_CLIENT_ID=client_E2E APPLE_APP_IDS=ABCDE12345.com.example.links \
            deploy/setup.sh root@localhost localhost 2>&1 | tee "$RUNNER_TEMP/setup-1.log" \
            || { echo "::error::setup.sh exited $? after: $(tail -n 1 "$RUNNER_TEMP/setup-1.log")"; exit 1; }

      - name: Check the fresh install
        timeout-minutes: 3
        run: |
          deploy/test/e2e.sh finished "$RUNNER_TEMP/setup-1.log"
          deploy/test/e2e.sh stack
          deploy/test/e2e.sh trust-caddy
          deploy/test/e2e.sh env-file PUBLIC_URL=https://localhost WORKOS_CLIENT_ID=client_E2E \
            APPLE_APP_IDS=ABCDE12345.com.example.links -WORKOS_API_KEY -APP_STORE_ID
          deploy/test/e2e.sh firewall "$RUNNER_TEMP/setup-1.log"
          deploy/test/e2e.sh api
          deploy/test/e2e.sh aasa ABCDE12345.com.example.links
          deploy/test/e2e.sh backup
          deploy/test/e2e.sh first-deploy
          deploy/test/e2e.sh tidy

      # Only WORKOS_API_KEY this time: what the first run set must survive.
      - name: setup.sh again with only WORKOS_API_KEY
        timeout-minutes: 10
        run: |
          WORKOS_API_KEY=sk_test_e2e \
            deploy/setup.sh root@localhost localhost 2>&1 | tee "$RUNNER_TEMP/setup-2.log" \
            || { echo "::error::setup.sh exited $? after: $(tail -n 1 "$RUNNER_TEMP/setup-2.log")"; exit 1; }

      - name: Check the settings were merged
        timeout-minutes: 3
        run: |
          deploy/test/e2e.sh finished "$RUNNER_TEMP/setup-2.log" live
          deploy/test/e2e.sh env-file PUBLIC_URL=https://localhost WORKOS_CLIENT_ID=client_E2E \
            WORKOS_API_KEY=sk_test_e2e APPLE_APP_IDS=ABCDE12345.com.example.links
          deploy/test/e2e.sh service-env WORKOS_API_KEY=sk_test_e2e
          deploy/test/e2e.sh stack
          deploy/test/e2e.sh data
          deploy/test/e2e.sh tidy

      - name: deploy.sh again
        timeout-minutes: 6
        run: |
          deploy/test/e2e.sh checksum running
          # The second deploy (setup.sh's) already made a .prev; this one must replace it.
          deploy/test/e2e.sh checksum prev-before /opt/links/links-server.prev
          deploy/deploy.sh root@localhost 2>&1 | tee "$RUNNER_TEMP/deploy-3.log" \
            || { echo "::error::deploy.sh exited $? after: $(tail -n 1 "$RUNNER_TEMP/deploy-3.log")"; exit 1; }

      - name: Check the redeploy kept a rollback target
        timeout-minutes: 3
        run: |
          deploy/test/e2e.sh finished "$RUNNER_TEMP/deploy-3.log" live
          deploy/test/e2e.sh same-binary running /opt/links/links-server.prev
          deploy/test/e2e.sh new-file prev-before /opt/links/links-server.prev
          deploy/test/e2e.sh stack
          deploy/test/e2e.sh data
          deploy/test/e2e.sh tidy

      # fake-bun.sh "builds" an executable that exits 1, so the new release never gets healthy.
      - name: deploy.sh rolls back a build that can't start
        timeout-minutes: 4
        run: |
          deploy/test/e2e.sh checksum good
          deploy/test/e2e.sh checksum prev /opt/links/links-server.prev
          rc=0
          BUN="$GITHUB_WORKSPACE/deploy/test/fake-bun.sh" deploy/deploy.sh root@localhost 2>&1 \
            | tee "$RUNNER_TEMP/deploy-bad.log" || rc=$?
          deploy/test/e2e.sh rolled-back "$rc" "$RUNNER_TEMP/deploy-bad.log"
          deploy/test/e2e.sh same-binary good
          deploy/test/e2e.sh same-binary prev /opt/links/links-server.prev
          deploy/test/e2e.sh same-file prev /opt/links/links-server.prev
          deploy/test/e2e.sh stack
          deploy/test/e2e.sh data
          deploy/test/e2e.sh tidy

      - name: Diagnostics
        if: always()
        timeout-minutes: 2
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then echo "Every check passed."; exit 0; fi
          deploy/test/e2e.sh diagnostics
